name: loghub

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'LogHub/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'LogHub/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка LogHub с warnings-as-errors
        run: dotnet build LogHub/LogHub.sln -warnaserror --configuration Release

      - name: Тесты LogHub
        run: dotnet test LogHub/LogHub.sln --no-build --configuration Release --verbosity normal